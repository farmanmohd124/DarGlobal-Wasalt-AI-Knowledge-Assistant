<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal & Wasalt AI Knowledge Assistant</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ec;color:#1c1c1c;display:flex;flex-direction:column;height:100vh}
header{background:#1c2b3a;color:#fff;padding:14px 20px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:12px;opacity:.7}
#log{flex:1;overflow:auto;padding:16px;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
.m{margin:10px 0;padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;line-height:1.45}
.u{background:#1c2b3a;color:#fff;margin-left:auto}.b{background:#fff;border:1px solid #ddd}
.s{font-size:11px;margin-top:6px;opacity:.7}.s a{color:#8a5a1f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{border:1px solid #bbb;background:#fff;border-radius:16px;padding:5px 11px;cursor:pointer;font-size:13px}
form{display:flex;gap:8px;padding:12px;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
input{flex:1;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:15px}button.send{background:#8a5a1f;color:#fff;border:0;border-radius:8px;padding:0 18px;cursor:pointer}
</style></head><body>
<header><h1>DarGlobal & Wasalt AI Knowledge Assistant</h1><p>Answers grounded in public data from darglobal.co.uk and wasalt.sa</p></header>
<div id="log"><div class="m b">Hi! Ask me about DarGlobal's projects and partners, or Wasalt's platform, auctions, AI tools and daily rentals.</div>
<div class="chips" id="chips"></div></div>
<form id="f"><input id="q" placeholder="Ask a question…" autocomplete="off"><button class="send">Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q');let hist=[];
["When is Trump Tower Jeddah delivered?","What is Wasalt Matchmaker?","Which luxury brands partner with DarGlobal?","How are daily rental payouts made on Wasalt?","How are DarGlobal and Wasalt related?"].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>send(t);chips.appendChild(b)});
function cleanAnswer(t){return t.replace(/^(\s*)[-*+]\s+/gm,'$1• ').replace(/\*\*(.*?)\*\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1$2').replace(/^#{1,6}\s+/gm,'')}
function add(t,c,src){const d=document.createElement('div');d.className='m '+c;d.textContent=c==='b'?cleanAnswer(t):t;
 if(src&&src.length){const s=document.createElement('div');s.className='s';s.innerHTML='Sources: '+[...new Map(src.map(x=>[x.url,x])).values()].map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.company}: ${x.title}</a>`).join(' · ');d.appendChild(s)}
 log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(t){if(!t.trim())return;const chips=document.getElementById('chips');if(chips)chips.remove();add(t,'u');q.value='';const w=add('Thinking…','b');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:hist})});const j=await r.json();w.remove();add(j.answer,'b',j.sources);hist.push({role:'user',content:t},{role:'assistant',content:j.answer})}
 catch(e){w.textContent='Error: '+e}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
</script></body></html>
